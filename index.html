<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6f9f64">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Number Duel">
<title>Number Duel</title>
<style>
:root {
    --ink: #2f2318;
    --muted: #6f6255;
    --gold: #d59a2d;
    --gold-dark: #9c6818;
    --red: #a93f32;
    --red-dark: #743027;
    --blue: #35669b;
    --blue-dark: #274e78;
    --parchment: rgba(255, 249, 231, 0.95);
    --parchment-soft: rgba(255, 252, 241, 0.90);
    --line: rgba(91, 61, 31, 0.28);
}

* { box-sizing: border-box; }
html, body {
    margin: 0;
    min-height: 100%;
    -webkit-text-size-adjust: 100%;
}

html {
    background: #6f9f64;
    overscroll-behavior: none;
}

body {
    min-height: 100vh;
    min-height: var(--visual-viewport-height, 100dvh);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background-color: #6f9f64;
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: scroll;
    transition: background-image 0.25s ease;
    position: relative;
    overflow-x: hidden;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(22, 29, 36, 0.12), rgba(22, 20, 18, 0.28));
    z-index: 0;
}

body.scene-start {
    background-image: url("assets/start-bg.png");
    background-position: center center;
}
body.scene-duel {
    background-image: url("assets/duel-bg.png");
    background-position: center center;
}
body.scene-privacy {
    background-image: url("assets/privacy-bg.png");
    background-position: center center;
}
body.scene-victory {
    background-image: url("assets/victory-bg.png");
    background-position: center center;
}

button, input {
    font: inherit;
    font-size: 16px; /* prevents Safari from zooming into form fields */
}
button {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
}
input {
    -webkit-user-select: text;
    user-select: text;
}
.screen, .scoreboard, .game-header, .logo-wrap, .privacy-shell, .result-card {
    -webkit-user-select: none;
    user-select: none;
}
button:disabled { cursor: default; opacity: .65; }

.app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 780px;
    background:
        linear-gradient(rgba(255,249,231,.96), rgba(249,239,209,.94));
    border: 3px solid rgba(108, 73, 34, .58);
    border-radius: 26px;
    padding: 38px;
    box-shadow:
        0 0 0 5px rgba(255, 222, 142, .28),
        0 20px 60px rgba(24, 18, 12, .36);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    scroll-margin-top: 18px;
}

.app::before,
.app::after {
    content: "";
    position: absolute;
    width: 28px;
    height: 28px;
    border: 3px solid rgba(128, 86, 37, .46);
    pointer-events: none;
}
.app::before {
    top: 11px; left: 11px;
    border-right: 0; border-bottom: 0;
    border-radius: 8px 0 0 0;
}
.app::after {
    right: 11px; bottom: 11px;
    border-left: 0; border-top: 0;
    border-radius: 0 0 8px 0;
}

.screen { display: none; }
.screen.active { display: block; }

/* ---------- Logo / typography ---------- */
.logo-wrap {
    text-align: center;
    margin: -4px auto 30px;
}
.logo-kicker {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--gold-dark);
    font-size: .85rem;
    font-weight: 850;
    letter-spacing: .18em;
    text-transform: uppercase;
    margin-bottom: 7px;
}
.logo-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(2.8rem, 7vw, 4.7rem);
    line-height: .9;
    font-weight: 900;
    letter-spacing: -.04em;
    color: #6f2e26;
    text-shadow: 0 2px 0 #f8d890, 0 4px 0 rgba(100,55,25,.18);
}
.logo-subtitle {
    margin-top: 13px;
    color: var(--muted);
    line-height: 1.45;
}

.title {
    text-align: center;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 2.35rem;
    line-height: 1.1;
    font-weight: 900;
    color: #5d2a25;
    margin-bottom: 9px;
}
.subtitle {
    text-align: center;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 34px;
}
.section-title {
    text-align: center;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.18rem;
    font-weight: 800;
    color: #5f462e;
    margin-bottom: 17px;
}

/* ---------- Buttons ---------- */
.primary-button,
.secondary-button {
    width: 100%;
    min-height: 56px;
    border-radius: 12px;
    padding: 14px 18px;
    font-weight: 850;
    letter-spacing: .01em;
    transition: transform .11s ease, box-shadow .11s ease, filter .11s ease;
}
.primary-button {
    border: 2px solid #7c4c13;
    color: white;
    background: linear-gradient(#d79b2c, #ae6f16);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 4px 0 #77480f;
}
.primary-button:hover:not(:disabled) {
    filter: brightness(1.04);
    transform: translateY(-1px);
}
.primary-button:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 1px 0 #77480f;
}
.secondary-button {
    border: 2px solid rgba(100, 72, 42, .38);
    color: #4c3827;
    background: rgba(255,255,255,.64);
}

/* ---------- Start ---------- */
.name-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 31px;
}
.field label {
    display: block;
    font-weight: 800;
    color: #59412e;
    margin-bottom: 7px;
}
.field input,
.number-input {
    width: 100%;
    border: 2px solid rgba(107,78,47,.33);
    border-radius: 12px;
    outline: none;
    background: rgba(255,255,255,.83);
    color: var(--ink);
    box-shadow: inset 0 2px 5px rgba(80,55,30,.06);
}
.field input {
    min-height: 56px;
    padding: 13px 14px;
    font-size: 1rem;
}
.field input:focus,
.number-input:focus {
    border-color: var(--gold-dark);
    box-shadow: 0 0 0 3px rgba(213,154,45,.16);
}

.levels {
    display: grid;
    gap: 13px;
    margin-bottom: 22px;
}
.level-button {
    width: 100%;
    padding: 18px 20px;
    border: 2px solid rgba(108,77,43,.27);
    border-radius: 14px;
    background: rgba(255,255,255,.63);
    text-align: left;
    color: var(--ink);
    box-shadow: 0 4px 11px rgba(76,50,25,.06);
    transition: transform .12s, border-color .12s, background .12s;
}
.level-button:hover {
    transform: translateY(-2px);
    border-color: rgba(157,104,24,.70);
    background: rgba(255,250,236,.9);
}
.level-button.selected {
    border-color: var(--gold-dark);
    background: linear-gradient(90deg, rgba(245,218,155,.72), rgba(255,249,230,.88));
    box-shadow: 0 0 0 3px rgba(213,154,45,.12);
}
.level-range {
    display: block;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.27rem;
    font-weight: 900;
    color: #653226;
    margin-bottom: 4px;
}
.level-description { color: #756757; font-size: .93rem; }
#startError {
    min-height: 25px;
    text-align: center;
    color: #a42f2f;
    font-weight: 700;
    margin-bottom: 8px;
}

/* ---------- Game header ---------- */
.game-header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    margin-bottom: 17px;
}
.round-label {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 900;
    color: #62432b;
}
.level-badge {
    justify-self: center;
    padding: 8px 14px;
    border: 1px solid rgba(108,77,43,.3);
    border-radius: 999px;
    background: rgba(255,255,255,.64);
    font-size: .88rem;
    font-weight: 800;
    white-space: nowrap;
}
.fullscreen-button {
    justify-self: end;
    width: 42px;
    height: 42px;
    border: 2px solid rgba(108,77,43,.25);
    border-radius: 11px;
    background: rgba(255,255,255,.69);
    color: #5d4630;
    font-size: 1.22rem;
}

.scoreboard {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: stretch;
    gap: 12px;
    margin-bottom: 16px;
}
.score-player {
    text-align: center;
    padding: 12px 14px;
    border-radius: 14px;
    border: 2px solid transparent;
}
.score-player.red-team {
    background: linear-gradient(180deg, rgba(180,67,53,.14), rgba(255,255,255,.46));
    border-color: rgba(169,63,50,.28);
}
.score-player.blue-team {
    background: linear-gradient(180deg, rgba(53,102,155,.14), rgba(255,255,255,.46));
    border-color: rgba(53,102,155,.28);
}
.score-name {
    font-size: .91rem;
    font-weight: 800;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 2px;
}
.red-team .score-name { color: var(--red-dark); }
.blue-team .score-name { color: var(--blue-dark); }
.score-number {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.95rem;
    font-weight: 900;
}
.score-divider {
    align-self: center;
    color: #8a7259;
    font-size: 1.25rem;
    font-weight: 900;
}
.starter-line {
    min-height: 24px;
    text-align: center;
    color: #725f4c;
    font-size: .9rem;
    font-weight: 650;
    margin-bottom: 12px;
}
.progress-track {
    width: 100%;
    height: 9px;
    background: rgba(89,66,42,.13);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 34px;
    box-shadow: inset 0 1px 2px rgba(63,42,23,.11);
}
#progressBar {
    height: 100%;
    background: linear-gradient(90deg, var(--red), var(--gold), var(--blue));
    border-radius: 999px;
    transition: width .25s ease;
}

/* ---------- Phases ---------- */
.phase-card { text-align: center; }
.player-turn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 15px;
    border: 1px solid rgba(104,75,42,.26);
    border-radius: 999px;
    background: rgba(255,255,255,.64);
    font-size: .92rem;
    font-weight: 850;
    margin-bottom: 19px;
}
.phase-heading {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.72rem;
    line-height: 1.25;
    font-weight: 900;
    color: #5e3128;
    margin-bottom: 10px;
}
.phase-explanation {
    max-width: 575px;
    margin: 0 auto 25px;
    color: #6f6254;
    line-height: 1.55;
}
.number-input {
    min-height: 62px;
    padding: 15px;
    text-align: center;
    font-size: 1.85rem;
    margin-bottom: 9px;
}
.input-help {
    min-height: 27px;
    color: #766959;
    font-size: .92rem;
    margin-bottom: 14px;
}
.error-text { color: #a72f2f; font-weight: 750; }

/* ---------- Privacy ---------- */
.privacy-shell {
    background: rgba(255,249,232,.83);
    border: 2px solid rgba(116,83,45,.31);
    border-radius: 22px;
    padding: 28px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.55);
}
.privacy-screen {
    min-height: 365px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}
.privacy-icon {
    width: 82px;
    height: 82px;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 2px solid rgba(94,68,39,.22);
    border-radius: 50%;
    background: rgba(255,255,255,.72);
    font-size: 2.55rem;
    margin-bottom: 21px;
    box-shadow: 0 6px 16px rgba(72,48,25,.12);
}
.privacy-warning {
    color: #9f342e;
    font-weight: 900;
    margin-bottom: 8px;
}
.privacy-player {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 2.15rem;
    font-weight: 900;
    color: #5c3428;
    margin-bottom: 9px;
}
.privacy-text {
    max-width: 485px;
    color: #6f6254;
    line-height: 1.5;
    margin-bottom: 28px;
}
.privacy-button { max-width: 420px; }

/* ---------- Challenge ---------- */
.challenge-text {
    min-height: 145px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 26px;
    border: 2px solid rgba(104,76,45,.21);
    border-radius: 17px;
    background: rgba(255,255,255,.70);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 2.02rem;
    line-height: 1.43;
    font-weight: 900;
    color: #573128;
    margin-bottom: 15px;
    overflow-wrap: anywhere;
    box-shadow: inset 0 0 22px rgba(201,165,101,.08);
}
.oral-instruction {
    margin-bottom: 24px;
    color: #675849;
    font-size: 1rem;
    font-weight: 700;
}

/* ---------- Feedback ---------- */
.feedback {
    padding: 22px;
    border-radius: 15px;
    font-size: 1.17rem;
    font-weight: 800;
    line-height: 1.52;
    text-align: center;
    border: 2px solid transparent;
}
.feedback.correct {
    background: rgba(230,247,232,.86);
    color: #27673b;
    border-color: rgba(68,132,82,.28);
}
.feedback.incorrect {
    background: rgba(255,235,232,.88);
    color: #a32f2c;
    border-color: rgba(169,63,50,.24);
}
.feedback-answer {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.42rem;
    margin-top: 3px;
}

/* ---------- Round results ---------- */
.round-result-title { text-align: center; margin-bottom: 5px; }
.round-score-line { text-align: center; color: #6d5e4f; margin-bottom: 23px; }
.round-results {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 21px;
}
.result-card {
    padding: 20px 17px;
    border: 2px solid rgba(107,78,48,.22);
    border-radius: 16px;
    text-align: center;
    background: rgba(255,255,255,.60);
}
.result-card.correct-card { border-color: rgba(60,125,74,.35); }
.result-card.incorrect-card { border-color: rgba(169,63,50,.33); }
.result-name {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.1rem;
    font-weight: 900;
    color: #5b382a;
    margin-bottom: 10px;
}
.result-symbol { font-size: 2.05rem; margin-bottom: 11px; }
.result-detail { color: #6b5f52; font-size: .91rem; line-height: 1.52; }
.result-detail strong { color: #382a20; }
.result-point { margin-top: 12px; font-weight: 900; }

/* ---------- Final ---------- */
.final-score {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 20px;
    margin: 32px 0;
}
.final-player {
    text-align: center;
    padding: 18px 12px;
    border-radius: 17px;
    background: rgba(255,255,255,.52);
    border: 2px solid rgba(108,77,43,.2);
}
.final-name {
    color: #6e5b49;
    font-weight: 800;
    margin-bottom: 7px;
    overflow: hidden;
    text-overflow: ellipsis;
}
.final-number {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 4.45rem;
    font-weight: 900;
    line-height: 1;
    color: #6b3127;
    text-shadow: 0 2px 0 #f7d990;
}
.final-dash { color: #9d835f; font-size: 2rem; }
#finalMessage {
    text-align: center;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.42rem;
    color: #5e3328;
    font-weight: 900;
    margin-bottom: 9px;
}
#finalSubMessage { text-align: center; color: #6f6254; margin-bottom: 31px; }
.final-buttons { display: grid; gap: 11px; }

/* ---------- iPad / touch optimisation ---------- */
@media (hover: none), (pointer: coarse) {
    .primary-button:hover:not(:disabled),
    .level-button:hover {
        transform: none;
        filter: none;
    }

    .primary-button,
    .secondary-button,
    .level-button,
    .fullscreen-button {
        min-height: 58px;
    }

    .fullscreen-button {
        min-width: 48px;
        min-height: 48px;
    }
}

/* iPad-sized screens: tighter vertical rhythm, larger tap targets. */
@media (min-width: 700px) and (max-width: 1400px) {
    body {
        align-items: center;
        padding:
            max(12px, env(safe-area-inset-top))
            max(18px, env(safe-area-inset-right))
            max(12px, env(safe-area-inset-bottom))
            max(18px, env(safe-area-inset-left));
    }

    .app {
        max-width: 720px;
        padding: 28px 32px;
    }

    .logo-wrap { margin-bottom: 21px; }
    .logo-title { font-size: clamp(3rem, 6vw, 4rem); }
    .logo-subtitle { margin-top: 10px; }
    .name-fields { margin-bottom: 21px; }
    .levels { gap: 10px; margin-bottom: 17px; }
    .level-button { padding: 14px 18px; }
    .game-header { margin-bottom: 12px; }
    .scoreboard { margin-bottom: 11px; }
    .starter-line { margin-bottom: 9px; }
    .progress-track { margin-bottom: 23px; }
    .player-turn { margin-bottom: 14px; }
    .phase-heading { margin-bottom: 8px; }
    .phase-explanation { margin-bottom: 18px; }
    .privacy-shell { padding: 21px 24px; }
    .privacy-screen { min-height: 300px; }
    .privacy-icon { width: 70px; height: 70px; margin-bottom: 15px; }
    .privacy-text { margin-bottom: 21px; }
    .challenge-text { min-height: 118px; padding: 20px 24px; margin-bottom: 12px; }
    .oral-instruction { margin-bottom: 17px; }
    .round-results { margin-bottom: 16px; }
    .result-card { padding: 16px 14px; }
    .final-score { margin: 25px 0; }
}

/* Most classroom iPads are used in landscape. The 16:9 artwork is deliberately
   centred so the important characters remain around the playable card on 4:3 screens. */
@media (min-width: 700px) and (orientation: landscape) and (max-aspect-ratio: 3/2) {
    body.scene-start,
    body.scene-duel,
    body.scene-privacy,
    body.scene-victory {
        background-size: cover;
        background-position: center center;
    }

    .app {
        width: min(720px, calc(100vw - 40px));
    }
}

/* Portrait remains fully usable, although landscape gives more of the artwork. */
@media (min-width: 700px) and (orientation: portrait) {
    .app {
        max-width: 680px;
    }

    .challenge-text {
        font-size: 1.8rem;
    }
}

/* When the iPad software keyboard is open, let the document scroll naturally. */
body.keyboard-open {
    align-items: flex-start;
}

body.keyboard-open .app {
    margin-top: max(8px, env(safe-area-inset-top));
}

/* ---------- Mobile ---------- */
@media (max-width: 600px) {
    body {
        display: block;
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
    }
    body::before { background: rgba(34,28,20,.18); }
    .app {
        min-height: 100vh;
        min-height: 100dvh;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
        padding: 26px 18px 31px;
        box-shadow: none;
        background: linear-gradient(rgba(255,249,231,.92), rgba(249,239,209,.91));
    }
    .app::before, .app::after { display: none; }
    .logo-title { font-size: 3.15rem; }
    .name-fields { grid-template-columns: 1fr; }
    .game-header { grid-template-columns: 1fr auto auto; }
    .level-badge { font-size: .77rem; padding: 7px 10px; }
    .challenge-text { min-height: 128px; padding: 20px 16px; font-size: 1.5rem; }
    .privacy-screen { min-height: calc(100dvh - 295px); }
    .privacy-shell { padding: 22px 15px; }
    .round-results { grid-template-columns: 1fr; }
    .final-number { font-size: 3.55rem; }
}
</style>
</head>
<body class="scene-start">

<div class="app">

    <!-- START -->
    <section id="startScreen" class="screen active">
        <div class="logo-wrap">
            <div class="logo-kicker"><span>⚔</span><span>Le combat des nombres</span><span>⚔</span></div>
            <div class="logo-title">Number Duel</div>
            <div class="logo-subtitle">
                Choisis un nombre pour ton adversaire, puis relève son défi.<br>
                8 manches · 1 réponse par joueur et par manche
            </div>
        </div>

        <div class="name-fields">
            <div class="field">
                <label for="playerAInput">Joueur 1</label>
                <input id="playerAInput" type="text" maxlength="20" placeholder="Prénom" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="next">
            </div>
            <div class="field">
                <label for="playerBInput">Joueur 2</label>
                <input id="playerBInput" type="text" maxlength="20" placeholder="Prénom" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="done">
            </div>
        </div>

        <div class="section-title">Choisissez le niveau</div>

        <div class="levels">
            <button class="level-button" data-max="100" data-name="0–100" onclick="selectLevel(this)">
                <span class="level-range">0–100</span>
                <span class="level-description">Nombres jusqu’à cent</span>
            </button>
            <button class="level-button" data-max="1000" data-name="0–1 000" onclick="selectLevel(this)">
                <span class="level-range">0–1 000</span>
                <span class="level-description">Nombres jusqu’à mille</span>
            </button>
            <button class="level-button" data-max="1000000" data-name="0–1 000 000" onclick="selectLevel(this)">
                <span class="level-range">0–1 000 000</span>
                <span class="level-description">Grands nombres jusqu’à un million</span>
            </button>
        </div>

        <div id="startError"></div>
        <button class="primary-button" onclick="startDuel()">⚔ Commencer le duel</button>
    </section>

    <!-- DUEL -->
    <section id="duelScreen" class="screen">
        <div class="game-header">
            <div id="roundDisplay" class="round-label">Manche 1 / 8</div>
            <div id="levelBadge" class="level-badge"></div>
            <button class="fullscreen-button" title="Plein écran" onclick="toggleFullscreen()">⛶</button>
        </div>

        <div class="scoreboard">
            <div class="score-player red-team">
                <div id="scoreNameA" class="score-name"></div>
                <div id="scoreA" class="score-number">0</div>
            </div>
            <div class="score-divider">⚔</div>
            <div class="score-player blue-team">
                <div id="scoreNameB" class="score-name"></div>
                <div id="scoreB" class="score-number">0</div>
            </div>
        </div>

        <div id="starterLine" class="starter-line"></div>
        <div class="progress-track"><div id="progressBar"></div></div>
        <div id="phaseArea"></div>
    </section>

    <!-- FINAL -->
    <section id="finalScreen" class="screen">
        <div class="title">Duel terminé</div>
        <div class="subtitle">Après 8 manches</div>

        <div class="final-score">
            <div class="final-player">
                <div id="finalNameA" class="final-name"></div>
                <div id="finalScoreA" class="final-number"></div>
            </div>
            <div class="final-dash">⚔</div>
            <div class="final-player">
                <div id="finalNameB" class="final-name"></div>
                <div id="finalScoreB" class="final-number"></div>
            </div>
        </div>

        <div id="finalMessage"></div>
        <div id="finalSubMessage"></div>

        <div class="final-buttons">
            <button class="primary-button" onclick="startRematch()">⚔ Revanche</button>
            <button class="secondary-button" onclick="returnToStart()">Nouvelle partie</button>
        </div>
    </section>
</div>

<script>
// ============================================================
// FRENCH NUMBER ENGINE
// ============================================================
const units = [
    "zéro", "un", "deux", "trois", "quatre", "cinq", "six", "sept", "huit",
    "neuf", "dix", "onze", "douze", "treize", "quatorze", "quinze", "seize"
];

function numberUnder100(n, terminal = true) {
    if (n <= 16) return units[n];
    if (n < 20) return "dix-" + units[n - 10];

    if (n < 70) {
        const tensNames = {2:"vingt",3:"trente",4:"quarante",5:"cinquante",6:"soixante"};
        const tens = Math.floor(n / 10);
        const unit = n % 10;
        const tensWord = tensNames[tens];
        if (unit === 0) return tensWord;
        if (unit === 1) return tensWord + " et un";
        return tensWord + "-" + units[unit];
    }

    if (n < 80) {
        const remainder = n - 60;
        if (remainder === 11) return "soixante et onze";
        return "soixante-" + numberUnder100(remainder);
    }

    if (n === 80) return terminal ? "quatre-vingts" : "quatre-vingt";
    return "quatre-vingt-" + numberUnder100(n - 80);
}

function numberUnder1000(n, terminal = true) {
    if (n < 100) return numberUnder100(n, terminal);

    const hundreds = Math.floor(n / 100);
    const remainder = n % 100;
    let result = hundreds === 1 ? "cent" : units[hundreds] + " cent";

    if (remainder === 0 && hundreds > 1 && terminal) result += "s";
    if (remainder > 0) result += " " + numberUnder100(remainder, terminal);
    return result;
}

function numberToFrench(n) {
    if (n === 0) return "zéro";
    if (n === 1000000) return "un million";
    if (n < 1000) return numberUnder1000(n);

    const thousands = Math.floor(n / 1000);
    const remainder = n % 1000;
    let result = thousands === 1 ? "mille" : numberUnder1000(thousands, false) + " mille";
    if (remainder > 0) result += " " + numberUnder1000(remainder);
    return result;
}

// ============================================================
// SETTINGS / STATE
// ============================================================
const TOTAL_ROUNDS = 8;

let playerA = "";
let playerB = "";
let scoreA = 0;
let scoreB = 0;
let currentRound = 1;
let selectedMax = null;
let selectedLevelName = "";
let challengeA = null;
let challengeB = null;
let answerA = null;
let answerB = null;
let correctA = false;
let correctB = false;
let matchStartingPlayer = "A";
let actionLocked = false;

// ============================================================
// SCENE / SCREEN
// ============================================================
function setScene(scene) {
    document.body.classList.remove("scene-start", "scene-duel", "scene-privacy", "scene-victory");
    document.body.classList.add("scene-" + scene);
}

function showScreen(id) {
    document.querySelectorAll(".screen").forEach(screen => screen.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

// ============================================================
// LEVEL / START
// ============================================================
function selectLevel(button) {
    document.querySelectorAll(".level-button").forEach(item => item.classList.remove("selected"));
    button.classList.add("selected");
    selectedMax = Number(button.dataset.max);
    selectedLevelName = button.dataset.name;
    document.getElementById("startError").textContent = "";
}

function startDuel() {
    const nameA = document.getElementById("playerAInput").value.trim();
    const nameB = document.getElementById("playerBInput").value.trim();
    const error = document.getElementById("startError");

    if (nameA === "" || nameB === "") {
        error.textContent = "Entrez les deux prénoms.";
        return;
    }
    if (selectedMax === null) {
        error.textContent = "Choisissez un niveau.";
        return;
    }

    playerA = nameA;
    playerB = nameB;
    matchStartingPlayer = "A";
    initialiseMatch();
}

function initialiseMatch() {
    scoreA = 0;
    scoreB = 0;
    currentRound = 1;
    resetRound();
    setupDuelScreen();
    showScreen("duelScreen");
    startCurrentRound();
}

function startRematch() {
    matchStartingPlayer = matchStartingPlayer === "A" ? "B" : "A";
    initialiseMatch();
}

function setupDuelScreen() {
    document.getElementById("scoreNameA").textContent = playerA;
    document.getElementById("scoreNameB").textContent = playerB;
    document.getElementById("levelBadge").textContent = selectedLevelName;
    updateHeader();
}

function getRoundStarter() {
    const oddRound = currentRound % 2 === 1;
    if (oddRound) return matchStartingPlayer;
    return matchStartingPlayer === "A" ? "B" : "A";
}

function updateHeader() {
    document.getElementById("roundDisplay").textContent = "Manche " + currentRound + " / " + TOTAL_ROUNDS;
    document.getElementById("scoreA").textContent = scoreA;
    document.getElementById("scoreB").textContent = scoreB;

    const starter = getRoundStarter();
    const starterName = starter === "A" ? playerA : playerB;
    document.getElementById("starterLine").textContent = starterName + " commence cette manche.";

    const progress = (currentRound / TOTAL_ROUNDS) * 100;
    document.getElementById("progressBar").style.width = progress + "%";
}

function resetRound() {
    challengeA = null;
    challengeB = null;
    answerA = null;
    answerB = null;
    correctA = false;
    correctB = false;
    actionLocked = false;
}

function startCurrentRound() {
    updateHeader();
    const starter = getRoundStarter();
    const starterName = starter === "A" ? playerA : playerB;
    showPrivacyScreen(starterName, "Tu commences cette manche.", () => {
        if (starter === "A") showChallengeSelectionA();
        else showChallengeSelectionB();
    });
}

// ============================================================
// INPUT PARSING
// ============================================================
function parseNumberInput(value) {
    value = value.replace(/\s/g, "").replace(/\u00A0/g, "");
    if (value === "") return null;
    if (!/^\d+$/.test(value)) return null;
    const number = Number(value);
    if (!Number.isInteger(number)) return null;
    return number;
}

// ============================================================
// PRIVACY
// ============================================================
function showPrivacyScreen(player, message, callback) {
    setScene("privacy");
    actionLocked = false;

    const area = document.getElementById("phaseArea");
    area.innerHTML = `
        <div class="privacy-shell">
            <div class="privacy-screen">
                <div class="privacy-icon">🛡️</div>
                <div class="privacy-warning">Ne regarde pas l’écran !</div>
                <div class="phase-heading">Passe l’appareil à</div>
                <div class="privacy-player">${escapeHtml(player)}</div>
                <div class="privacy-text">
                    ${escapeHtml(message)}<br>
                    Quand l’appareil est prêt, appuie sur le bouton.
                </div>
                <button id="readyButton" class="primary-button privacy-button">Je suis prêt(e)</button>
            </div>
        </div>
    `;

    const button = document.getElementById("readyButton");
    button.addEventListener("click", () => runOnce(button, callback));
}

// ============================================================
// CHALLENGE SELECTION
// ============================================================
function showChallengeSelectionA() {
    renderChallengeSelection(playerA, playerB, saveChallengeA);
}

function saveChallengeA() {
    if (actionLocked) return;
    const number = readChallengeInput();
    if (number === null) return;

    actionLocked = true;
    challengeA = number;

    if (getRoundStarter() === "A") {
        showPrivacyScreen(playerB, "Choisis maintenant ton défi pour " + playerA + ".", showChallengeSelectionB);
    } else {
        beginAnswerPhase();
    }
}

function showChallengeSelectionB() {
    renderChallengeSelection(playerB, playerA, saveChallengeB);
}

function saveChallengeB() {
    if (actionLocked) return;
    const number = readChallengeInput();
    if (number === null) return;

    actionLocked = true;
    challengeB = number;

    if (getRoundStarter() === "B") {
        showPrivacyScreen(playerA, "Choisis maintenant ton défi pour " + playerB + ".", showChallengeSelectionA);
    } else {
        beginAnswerPhase();
    }
}

function renderChallengeSelection(chooser, opponent, saveFunction) {
    setScene("duel");
    actionLocked = false;
    const area = document.getElementById("phaseArea");

    area.innerHTML = `
        <div class="phase-card">
            <div class="player-turn">⚔ ${escapeHtml(chooser)}</div>
            <div class="phase-heading">Choisis un nombre pour ${escapeHtml(opponent)}</div>
            <div class="phase-explanation">
                Entre un nombre entre <strong>0</strong> et <strong>${formatNumber(selectedMax)}</strong>.<br>
                Ton adversaire ne le verra pas avant son défi.
            </div>
            <input id="challengeInput" class="number-input" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="Ton défi">
            <div id="challengeError" class="input-help"></div>
            <button id="challengeButton" class="primary-button">🔒 Verrouiller mon défi</button>
        </div>
    `;

    document.getElementById("challengeButton").addEventListener("click", saveFunction);
    setupEnterKey("challengeInput", saveFunction);
    focusElement("challengeInput");
}

function readChallengeInput() {
    const input = document.getElementById("challengeInput");
    const number = parseNumberInput(input.value);

    if (number === null || number < 0 || number > selectedMax) {
        document.getElementById("challengeError").innerHTML = `
            <span class="error-text">Choisis un nombre entre 0 et ${formatNumber(selectedMax)}.</span>
        `;
        return null;
    }
    return number;
}

// ============================================================
// ANSWER PHASE
// ============================================================
function beginAnswerPhase() {
    const starter = getRoundStarter();
    if (starter === "A") {
        showPrivacyScreen(playerA, "Ton adversaire a préparé ton défi.", showAnswerA);
    } else {
        showPrivacyScreen(playerB, "Ton adversaire a préparé ton défi.", showAnswerB);
    }
}

function showAnswerA() {
    renderAnswerScreen(playerA, challengeB, submitAnswerA);
}

function submitAnswerA() {
    if (actionLocked) return;
    const answer = readAnswer();
    if (answer === null) return;

    actionLocked = true;
    answerA = answer;
    correctA = answerA === challengeB;
    if (correctA) scoreA++;
    updateHeader();

    showAnswerFeedback(playerA, correctA, challengeB, () => {
        if (getRoundStarter() === "A") {
            showPrivacyScreen(playerB, "À ton tour de relever ton défi.", showAnswerB);
        } else {
            showRoundResults();
        }
    });
}

function showAnswerB() {
    renderAnswerScreen(playerB, challengeA, submitAnswerB);
}

function submitAnswerB() {
    if (actionLocked) return;
    const answer = readAnswer();
    if (answer === null) return;

    actionLocked = true;
    answerB = answer;
    correctB = answerB === challengeA;
    if (correctB) scoreB++;
    updateHeader();

    showAnswerFeedback(playerB, correctB, challengeA, () => {
        if (getRoundStarter() === "B") {
            showPrivacyScreen(playerA, "À ton tour de relever ton défi.", showAnswerA);
        } else {
            showRoundResults();
        }
    });
}

function renderAnswerScreen(player, challenge, submitFunction) {
    setScene("duel");
    actionLocked = false;
    const area = document.getElementById("phaseArea");

    area.innerHTML = `
        <div class="phase-card">
            <div class="player-turn">🛡 ${escapeHtml(player)}</div>
            <div class="phase-heading">Quel est ce nombre ?</div>
            <div class="challenge-text">${numberToFrench(challenge)}</div>
            <div class="oral-instruction">🔊 Lis d’abord le nombre à voix haute. Ensuite, écris-le en chiffres.</div>
            <input id="answerInput" class="number-input" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="Écris le nombre en chiffres">
            <div id="answerError" class="input-help"></div>
            <button id="answerButton" class="primary-button">Valider ma réponse</button>
        </div>
    `;

    document.getElementById("answerButton").addEventListener("click", submitFunction);
    setupEnterKey("answerInput", submitFunction);
    focusElement("answerInput");
}

function readAnswer() {
    const input = document.getElementById("answerInput");
    const answer = parseNumberInput(input.value);

    if (answer === null) {
        document.getElementById("answerError").innerHTML = `<span class="error-text">Écris un nombre en chiffres.</span>`;
        return null;
    }
    return answer;
}

// ============================================================
// FEEDBACK
// ============================================================
function showAnswerFeedback(player, correct, correctNumber, callback) {
    setScene("duel");
    actionLocked = false;
    const area = document.getElementById("phaseArea");

    let content;
    if (correct) {
        content = `
            <div class="feedback correct">
                <div>✓ Correct !</div>
                <div class="feedback-answer">${formatNumber(correctNumber)}</div>
            </div>
        `;
    } else {
        content = `
            <div class="feedback incorrect">
                <div>✗ Incorrect.</div>
                <div>La réponse était</div>
                <div class="feedback-answer">${formatNumber(correctNumber)}</div>
            </div>
        `;
    }

    area.innerHTML = `
        <div class="phase-card">
            <div class="player-turn">${escapeHtml(player)}</div>
            ${content}
            <button id="continueButton" class="primary-button" style="margin-top:18px;">Continuer</button>
        </div>
    `;

    const button = document.getElementById("continueButton");
    button.addEventListener("click", () => runOnce(button, callback));
}

// ============================================================
// ROUND RESULTS
// ============================================================
function showRoundResults() {
    setScene("duel");
    actionLocked = false;
    const area = document.getElementById("phaseArea");
    const buttonText = currentRound === TOTAL_ROUNDS ? "Voir le résultat final" : "Manche suivante";

    area.innerHTML = `
        <div>
            <div class="phase-heading round-result-title">Manche ${currentRound} terminée</div>
            <div class="round-score-line">
                ${escapeHtml(playerA)} <strong>${scoreA}</strong> &nbsp;⚔&nbsp; <strong>${scoreB}</strong> ${escapeHtml(playerB)}
            </div>
            <div class="round-results">
                ${createResultCard(playerA, correctA, challengeB, answerA)}
                ${createResultCard(playerB, correctB, challengeA, answerB)}
            </div>
            <button id="finishRoundButton" class="primary-button">${buttonText}</button>
        </div>
    `;

    const button = document.getElementById("finishRoundButton");
    button.addEventListener("click", () => runOnce(button, finishRound));
}

function createResultCard(player, correct, challenge, answer) {
    const cssClass = correct ? "correct-card" : "incorrect-card";
    const symbol = correct ? "✓" : "✗";
    const pointText = correct ? "+1 point" : "0 point";

    return `
        <div class="result-card ${cssClass}">
            <div class="result-name">${escapeHtml(player)}</div>
            <div class="result-symbol">${symbol}</div>
            <div class="result-detail">
                Nombre :<br>
                <strong>${numberToFrench(challenge)}</strong><br>
                ${formatNumber(challenge)}<br><br>
                Réponse donnée :<br>
                <strong>${formatNumber(answer)}</strong>
            </div>
            <div class="result-point">${pointText}</div>
        </div>
    `;
}

function finishRound() {
    if (currentRound >= TOTAL_ROUNDS) {
        showFinalResults();
        return;
    }

    currentRound++;
    resetRound();
    updateHeader();
    startCurrentRound();
}

// ============================================================
// FINAL
// ============================================================
function showFinalResults() {
    setScene("victory");

    document.getElementById("finalNameA").textContent = playerA;
    document.getElementById("finalNameB").textContent = playerB;
    document.getElementById("finalScoreA").textContent = scoreA;
    document.getElementById("finalScoreB").textContent = scoreB;

    let message;
    let subMessage;

    if (scoreA > scoreB) {
        message = playerA + " remporte le duel !";
        subMessage = "Bravo à vous deux.";
    } else if (scoreB > scoreA) {
        message = playerB + " remporte le duel !";
        subMessage = "Bravo à vous deux.";
    } else {
        message = "Égalité !";
        subMessage = "La revanche départagera peut-être les joueurs.";
    }

    document.getElementById("finalMessage").textContent = message;
    document.getElementById("finalSubMessage").textContent = subMessage;
    showScreen("finalScreen");
}

function returnToStart() {
    setScene("start");
    showScreen("startScreen");
}

// ============================================================
// UTILITIES
// ============================================================
function runOnce(button, callback) {
    if (actionLocked) return;
    actionLocked = true;
    if (button) button.disabled = true;
    callback();
}

function formatNumber(n) {
    return n.toLocaleString("fr-FR");
}

function focusElement(id) {
    setTimeout(() => {
        const element = document.getElementById(id);
        if (!element) return;

        element.focus({ preventScroll: true });
        ensureElementVisible(element);
    }, 80);
}

function ensureElementVisible(element) {
    if (!element) return;

    setTimeout(() => {
        element.scrollIntoView({
            behavior: "smooth",
            block: "center",
            inline: "nearest"
        });
    }, 180);
}

function setupEnterKey(id, callback) {
    const element = document.getElementById(id);
    if (!element) return;
    element.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            callback();
        }
    });
}

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}


// ============================================================
// iPAD / SAFARI VIEWPORT HANDLING
// ============================================================
function updateVisualViewport() {
    const viewportHeight = window.visualViewport
        ? window.visualViewport.height
        : window.innerHeight;

    document.documentElement.style.setProperty(
        "--visual-viewport-height",
        viewportHeight + "px"
    );

    const keyboardOpen = window.visualViewport
        ? window.visualViewport.height < window.innerHeight * 0.78
        : false;

    document.body.classList.toggle("keyboard-open", keyboardOpen);

    if (keyboardOpen && document.activeElement && document.activeElement.tagName === "INPUT") {
        ensureElementVisible(document.activeElement);
    }
}

function configureFullscreenButton() {
    const button = document.querySelector(".fullscreen-button");
    if (!button) return;

    const fullscreenSupported = Boolean(
        document.documentElement.requestFullscreen ||
        document.documentElement.webkitRequestFullscreen
    );

    if (!fullscreenSupported || window.navigator.standalone) {
        button.style.display = "none";
    }
}

window.addEventListener("resize", updateVisualViewport, { passive: true });
window.addEventListener("orientationchange", () => {
    setTimeout(updateVisualViewport, 250);
}, { passive: true });

if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", updateVisualViewport, { passive: true });
    window.visualViewport.addEventListener("scroll", updateVisualViewport, { passive: true });
}

document.addEventListener("focusin", event => {
    if (event.target && event.target.tagName === "INPUT") {
        ensureElementVisible(event.target);
    }
});

document.addEventListener("DOMContentLoaded", () => {
    updateVisualViewport();
    configureFullscreenButton();
});

async function toggleFullscreen() {
    try {
        const root = document.documentElement;
        const fullscreenElement = document.fullscreenElement || document.webkitFullscreenElement;

        if (fullscreenElement) {
            if (document.exitFullscreen) {
                await document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        } else {
            if (root.requestFullscreen) {
                await root.requestFullscreen();
            } else if (root.webkitRequestFullscreen) {
                root.webkitRequestFullscreen();
            }
        }
    } catch (error) {
        // Fullscreen is optional on iPad Safari; the layout does not depend on it.
    }
}
</script>
